[project]
name = "freecut-local-runtime"
version = "0.1.0"
description = "Native local inference runtime for FreeCut"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate>=1.8,<2",
  "diffusers>=0.35,<1",
  "fastapi>=0.116,<1",
  "pillow>=11,<13",
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "transformers>=4.53,<6",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
]

[project.scripts]
freecut-sidecar = "freecut_sidecar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freecut_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
